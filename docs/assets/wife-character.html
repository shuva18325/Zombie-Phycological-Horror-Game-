<!doctype html>
<meta charset="utf-8">
<title>HexWorld Tycoon — Della (Wife NPC) character card</title>
<style>html,body{margin:0;background:#efdcae}#stage{width:900px;height:640px}</style>
<div id="stage"></div>
<script>
// Della bust portrait (same model used in the playable game), composited on a farm scene.
function dellaSVG(){
  const eyeOpen=(cx)=>`<ellipse cx="${cx}" cy="150" rx="15" ry="17" fill="#fff" stroke="#8a5a30" stroke-width="2"/>

     <circle cx="${cx-1}" cy="149" r="2" fill="#fff"/>`;

  const mouth=`<path d="M374 194 q25 20 52 0" fill="none" stroke="#8a3a2a" stroke-width="5" stroke-linecap="round"/>
               <path d="M378 196 q23 12 44 0" fill="#fff"/>`;
  const brows=`<path d="M346 126 q14 -8 28 -2" fill="none" stroke="#b98a2a" stroke-width="4" stroke-linecap="round"/>
               <path d="M424 124 q14 -6 28 2" fill="none" stroke="#b98a2a" stroke-width="4" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6cda6"/><stop offset="1" stop-color="#e7b184"/></linearGradient>
      <linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4cd55"/><stop offset="1" stop-color="#c98f22"/></linearGradient>
      <linearGradient id="ppl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d84636"/><stop offset="1" stop-color="#b32f24"/></linearGradient>
      <clipPath id="torso"><path d="M250 360 C250 300 300 262 340 258 C420 254 500 262 550 360 Z"/></clipPath>
    </defs>
    <path d="M250 360 C250 300 300 262 340 258 C380 254 420 254 460 258 C500 262 550 300 550 360 Z" fill="url(#ppl)" stroke="#7d1f16" stroke-width="3"/>
    <g clip-path="url(#torso)">
      ${(()=>{let s='';for(let x=250;x<560;x+=26)s+=`<rect x="${x}" y="255" width="8" height="120" fill="#9c2b20" opacity="0.5"/>`;for(let y=258;y<380;y+=26)s+=`<rect x="250" y="${y}" width="310" height="8" fill="#9c2b20" opacity="0.5"/>`;return s;})()}
    </g>
    <path d="M360 268 L399 320 L438 268 L422 260 L399 300 L376 260 Z" fill="#c53b2c" stroke="#7d1f16" stroke-width="2"/>
    <circle cx="399" cy="330" r="3.6" fill="#f0d8a0" stroke="#9a7a24" stroke-width="1"/>
    <circle cx="399" cy="352" r="3.6" fill="#f0d8a0" stroke="#9a7a24" stroke-width="1"/>
    <path d="M372 238 C372 268 384 282 399 284 C414 282 426 268 426 238 C410 232 388 232 372 238 Z" fill="url(#pk)" stroke="#8a5a30" stroke-width="3"/>
    <path d="M318 120 C300 210 306 268 344 300 C332 240 332 176 346 140 Z" fill="url(#ph)" stroke="#a9781e" stroke-width="2"/>
    <path d="M480 120 C498 210 492 268 454 300 C466 240 466 176 452 140 Z" fill="url(#ph)" stroke="#a9781e" stroke-width="2"/>
    <path d="M330 128 C330 82 362 58 399 58 C436 58 468 82 468 128 C468 176 442 210 399 214 C356 210 330 176 330 128 Z" fill="url(#pk)" stroke="#8a5a30" stroke-width="3"/>
    <ellipse cx="330" cy="142" rx="10" ry="15" fill="#f0be93" stroke="#8a5a30" stroke-width="2"/>
    <ellipse cx="468" cy="142" rx="10" ry="15" fill="#f0be93" stroke="#8a5a30" stroke-width="2"/>
    <ellipse cx="356" cy="176" rx="15" ry="8" fill="#f0a0a0" opacity="0.5"/>
    <ellipse cx="442" cy="176" rx="15" ry="8" fill="#f0a0a0" opacity="0.5"/>
    <path d="M399 162 q6 10 -2 16" fill="none" stroke="#dda877" stroke-width="3" stroke-linecap="round"/>
    ${eyes}${brows}${mouth}
    <path d="M330 128 C322 190 330 250 350 282 C346 236 344 186 352 150 C344 150 336 142 330 128 Z" fill="url(#ph)" stroke="#a9781e" stroke-width="1.5"/>
    <path d="M468 128 C476 190 468 250 448 282 C452 236 454 186 446 150 C454 150 462 142 468 128 Z" fill="url(#ph)" stroke="#a9781e" stroke-width="1.5"/>
    <path d="M340 118 C368 100 430 100 458 118 C440 136 414 130 399 126 C384 130 358 136 340 118 Z" fill="url(#ph)" stroke="#a9781e" stroke-width="1.5"/>
    <ellipse cx="399" cy="100" rx="132" ry="34" fill="#ffffff" stroke="#cfc9bd" stroke-width="4"/>
    <path d="M340 100 C338 52 372 32 399 32 C426 32 460 52 458 100 C430 82 366 82 340 100 Z" fill="#ffffff" stroke="#cfc9bd" stroke-width="4"/>
    <path d="M342 96 C368 82 430 82 456 96 C454 106 454 106 454 108 C430 96 366 96 344 108 Z" fill="#2a2a2a"/>
    <rect x="392" y="92" width="14" height="11" rx="2" fill="#3a3a3a"/>
  </svg>`;
}
const NS="http://www.w3.org/2000/svg";
const svg=document.createElementNS(NS,"svg");
svg.setAttribute("viewBox","0 0 900 640");svg.setAttribute("width",900);svg.setAttribute("height",640);
svg.innerHTML=`
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e9c9"/><stop offset="1" stop-color="#f3d9a6"/></linearGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0402f"/><stop offset="1" stop-color="#9c2f22"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e4326"/><stop offset="1" stop-color="#4f2f18"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="470" fill="url(#sky)"/>
  <ellipse cx="150" cy="80" rx="90" ry="24" fill="#f7d9d0" opacity="0.85"/>
  <ellipse cx="720" cy="70" rx="110" ry="26" fill="#f7d9d0" opacity="0.85"/>
  <rect x="0" y="430" width="900" height="210" fill="#bcd07a"/>
  <rect x="0" y="430" width="900" height="16" fill="#a7c065"/>
  <!-- barn right -->
  <rect x="620" y="250" width="240" height="220" fill="url(#barn)" stroke="#7d251b" stroke-width="4"/>
  <path d="M610 256 L720 184 L872 184 L872 256 Z" fill="url(#roof)" stroke="#3f2512" stroke-width="4"/>
  <rect x="690" y="320" width="120" height="150" fill="#a9342a" stroke="#f0d8b0" stroke-width="5"/>
  <line x1="690" y1="320" x2="810" y2="470" stroke="#f0d8b0" stroke-width="5"/>
  <line x1="810" y1="320" x2="690" y2="470" stroke="#f0d8b0" stroke-width="5"/>
  <!-- sign left -->
  <rect x="44" y="360" width="12" height="110" fill="#7a5330"/><rect x="150" y="360" width="12" height="110" fill="#7a5330"/>
  <rect x="30" y="342" width="146" height="60" rx="8" fill="#e8d3a6" stroke="#7a5330" stroke-width="4"/>
  <text x="103" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#7a3b1e">COUNTY</text>
  <text x="103" y="392" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#7a3b1e">FARM</text>
  <!-- nameplate -->
  <rect x="250" y="566" width="400" height="58" rx="12" fill="#fbf3df" stroke="#b98a2a" stroke-width="3"/>
  <text x="450" y="596" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#b6402f">DELLA</text>
  <text x="450" y="614" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" letter-spacing="2" fill="#8a795c">THE FARMER'S WIFE</text>
`;
document.getElementById("stage").appendChild(svg);
// place the portrait
const g=document.createElementNS(NS,"g");
g.setAttribute("transform","translate(230,180) scale(0.68)");
g.innerHTML=dellaSVG();
svg.appendChild(g);
</script>
