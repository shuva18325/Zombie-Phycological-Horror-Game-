name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - claude/zombie-outbreak-game-q8l76m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Serve the contents of the game/ folder at the site root so the
      # game loads directly at the Pages URL (paths inside are relative).
      - name: Upload game/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
